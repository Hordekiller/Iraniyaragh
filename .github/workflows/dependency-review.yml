name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject newly introduced vulnerable dependencies
        if: ${{ github.event.repository.private == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
      # GitHub's dependency-review API requires a paid security entitlement for
      # private repositories. Keep this required check blocking by auditing the
      # complete lockfile instead; this is stricter than checking only the PR diff.
      - name: Install pnpm for private-repository audit
        if: ${{ github.event.repository.private }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - name: Configure Node.js for private-repository audit
        if: ${{ github.event.repository.private }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Reject vulnerable dependencies in the private lockfile
        if: ${{ github.event.repository.private }}
        run: pnpm audit --audit-level=moderate
