# Shared request routing for the storefront vhost.
#
# This is the body of the public vhost, factored out so the HTTP and HTTPS server
# blocks cannot drift apart. It is `include`d inside a `server { }` block, so
# nginx splices it in at that point: the locations below end up at server
# context, which is where they are written as if they had been inline.
#
# Nothing here may depend on `$scheme`. The API decides whether to build `http`
# or `https` URLs from its own configuration (PUBLIC_MEDIA_ORIGIN) and not from
# the hop the request arrived on, and the only X-Forwarded-Proto value that
# matters is the one the outer server block sets.
    # --- API -----------------------------------------------------------------
    location /api/ {
        # No trailing URI is added to the rewritten path, so the original
        # request URI including the /api prefix is forwarded, which is what
        # proxy_pass against a literal upstream used to do implicitly.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API must be told how many proxies precede it so it builds correct
        # client IPs; TRUST_PROXY in the env template matches this hop count.
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Unversioned health probe for the container's own healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Admin ---------------------------------------------------------------
    # Mounted under /admin so the storefront and the staff UI share one origin.
    # Next.js needs the base path to match, otherwise its asset URLs point at the
    # storefront root. The Admin build therefore receives
    # NEXT_PUBLIC_BASE_PATH=/admin, and the admin service in compose passes it
    # through; the two must not drift apart.
    #
    # The /admin prefix is preserved, so the upstream sees the path the basePath
    # expects.
    #
    # --- trailing slash -------------------------------------------------------
    # Next.js treats `/admin` as canonical and answers `/admin/` with a 308 back
    # to `/admin`. This file used to do the opposite, redirecting `/admin` to
    # `/admin/`, and the pair formed a loop that took the Admin down:
    #
    #     /admin  --301-->  /admin/  --308-->  /admin  ...
    #
    # Every layer here has to agree with the app's own canonical form, and the
    # app's is the one without the trailing slash. So `/admin` is proxied
    # straight through and only `/admin/` is redirected, and it is redirected
    # *to* the canonical form rather than away from it. `$is_args$args` keeps the
    # query string, which a bare `return 301 /admin` would silently drop.
    #
    # A redirect loop is valid nginx syntax, so `nginx -t` cannot catch this kind
    # of mistake; only asserting the real response codes can. See
    # e2e/tests/nginx-routing.spec.ts.
    location = /admin/ {
        return 301 /admin$is_args$args;
    }

    # Matches `/admin` itself as well as every path beneath it, which is what
    # carries the basePath asset requests (`/admin/_next/...`) to the Admin.
    location /admin {
        # The /admin prefix must survive, because the Admin is built with
        # NEXT_PUBLIC_BASE_PATH=/admin and expects the path it was built for.
        proxy_pass $admin_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Signed private upload PUTs. Preserve the complete path, query and Host:
    # rewriting any of them breaks the S3 signature. Never serve source GETs,
    # list buckets, or log the credential-bearing signed query string.
    # The path-style bucket segment must match OBJECT_STORAGE_BUCKET=products.
    location ^~ /products/quarantine/products/ {
        limit_except PUT { deny all; }
        client_max_body_size 20m;
        access_log off;
        proxy_pass $media_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- Product media (S3-compatible object storage) ------------------------
    # PUBLIC_MEDIA_ORIGIN is the browser-facing base for published product
    # images, and the API builds URLs as `<origin>/<object key>`. Object keys
    # carry no bucket name, but the object store is addressed path-style, so a
    # request has to arrive as `/{bucket}/{key}`.
    #
    # Stripping the `/media/` prefix below is therefore load-bearing: a request
    # for `/media/products/renditions/...` must reach the store as
    # `/products/renditions/...`. That means PUBLIC_MEDIA_ORIGIN must include
    # the bucket segment (`.../media/products` for OBJECT_STORAGE_BUCKET=products),
    # the same shape local development already uses via localhost:9000.
    # Changing OBJECT_STORAGE_BUCKET without changing PUBLIC_MEDIA_ORIGIN breaks
    # every product image, so both live in the env template next to each other.
    #
    # Bucket listing is not exposed; only keys the API publishes are reachable.
    location /media/ {
        # The /media prefix is stripped by this rewrite rather than by a trailing
        # slash on proxy_pass. A proxy_pass that contains a variable cannot carry
        # a URI component, so nginx would forward the untouched request URI and
        # the store would look for a key literally starting with "media/". The
        # capture group supplies the leading slash, so the store receives
        # /<bucket>/<key> exactly as a path-style S3 request requires.
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- Storefront ----------------------------------------------------------
    # The storefront is a single-page app, so unknown paths fall back to
    # index.html and the client router resolves them. `index.html` is served
    # without caching; hashed assets under /assets are immutable.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
