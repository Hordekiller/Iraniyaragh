# HTTP-context diagnostics shared by the deployed proxy and routing harness.
# Only validated opaque identifiers cross the edge. No query/path/identity is logged.
map $http_x_request_id $diagnostic_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}
map $http_x_correlation_id $diagnostic_correlation_id {
    default $diagnostic_request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
}
map $request_uri $diagnostic_surface {
    default storefront;
    ~^/api/ api;
    ~^/admin admin;
    ~^/products/quarantine/ media-upload;
    ~^/media/ media;
    ~^/sitemap discovery;
    ~^/robots\.txt discovery;
}
log_format diagnostics escape=json '{"timestamp":"$time_iso8601","service":"iranyaragh-web","event":"proxy.request.completed","requestId":"$diagnostic_request_id","correlationId":"$diagnostic_correlation_id","surface":"$diagnostic_surface","method":"$request_method","statusCode":$status,"durationSeconds":$request_time,"upstreamStatus":"$upstream_status","upstreamSeconds":"$upstream_response_time"}';
