name: Discovery Audit

on:
  pull_request:
    paths:
      - ".github/scripts/discovery-audit.mjs"
      - ".github/workflows/discovery-audit.yml"
      - "docs/SEO_GEO_AI_DISCOVERY_PLAN.md"
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Canonical HTTPS production origin; defaults to PRODUCTION_WEB_ORIGIN variable"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: discovery-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify discovery-audit invariants
        run: node .github/scripts/discovery-audit.mjs --self-test

  production:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_ORIGIN: ${{ inputs.base_url || vars.PRODUCTION_WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Audit deployed discovery contract
        if: env.AUDIT_ORIGIN != ''
        run: node .github/scripts/discovery-audit.mjs "$AUDIT_ORIGIN" | tee discovery-audit.json
      - name: Explain missing production configuration
        if: env.AUDIT_ORIGIN == ''
        run: echo "PRODUCTION_WEB_ORIGIN is not configured; production audit is intentionally inactive."
      - name: Upload sanitized audit evidence
        if: env.AUDIT_ORIGIN != '' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: discovery-audit
          path: discovery-audit.json
          if-no-files-found: error
          retention-days: 30
