name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Logs/screenshots/version without secrets or personal data.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        [
          P0 - incident/data loss,
          P1 - critical path blocked,
          P2 - normal defect,
          P3 - minor,
        ]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, inventory, payment or security impact
    validations:
      required: true
