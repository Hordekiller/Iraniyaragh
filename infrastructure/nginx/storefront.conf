# Public storefront vhost.
#
# This is the only container that publishes a host port. Postgres, Redis, the
# object store, the API and the Admin stay on the internal Compose network and
# are reached only through this proxy, so the database and cache are not
# exposed to the internet.
#
# Upstream names must match the Compose service names.
#
# Docker's embedded DNS server is 127.0.0.11, and it is the only way to make
# these upstreams survive a restart. A `server api:4000` inside an `upstream`
# block is resolved once, at startup, and never again: when the api container is
# recreated it usually gets a different IP, and nginx keeps dialling the old one
# until someone restarts this container. That is not a theoretical concern, it
# is what a host reboot does. The symptom is a 502 on exactly the routes that
# depend on a restarted backend, while everything else still looks healthy.
#
# The fix is to resolve the name per request instead, which requires a `resolver`
# and a variable in `proxy_pass` (nginx does not re-resolve a literal hostname,
# and it will not use a variable for an `upstream` block's server list). The
# tradeoff is that a variable in proxy_pass drops the automatic URI handling, so
# the URI is written out explicitly per location, which is where the `/media/`
# prefix-stripping comment below becomes load-bearing rather than incidental.
server {
    listen 80;
    server_name _;

    # `resolver` and `set` are both server-context directives: `set` is rejected
    # at the top level of an included file, so they live here.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;
    set $admin_upstream http://admin:3001;
    set $media_upstream http://object-store:9000;

    # The stock default.conf shipped in the base image declared the docroot
    # here, and replacing that file dropped it. Without an explicit root,
    # Nginx falls back to its compiled-in default, which does not exist in
    # this image, and every storefront request 404s.
    root /usr/share/nginx/html;
    index index.html;

    # Container-level defaults. A real deployment terminates TLS at this same
    # container once certificates are mounted, or puts a TLS-terminating proxy
    # in front of it; the API refuses to boot in staging/production unless
    # STOREFRONT_ORIGIN and PUBLIC_MEDIA_ORIGIN are https, so an
    # http-only exposure cannot be mistaken for a finished deployment.
    client_max_body_size 12m;

    # Do not advertise the Nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # --- API -----------------------------------------------------------------
    location /api/ {
        # No trailing URI is added to the rewritten path, so the original
        # request URI including the /api prefix is forwarded, which is what
        # proxy_pass against a literal upstream used to do implicitly.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API must be told how many proxies precede it so it builds correct
        # client IPs; TRUST_PROXY in the env template matches this hop count.
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Unversioned health probe for the container's own healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Admin ---------------------------------------------------------------
    # Mounted under /admin so the storefront and the staff UI share one origin.
    # Next.js needs the base path to match, otherwise its asset URLs point at the
    # storefront root. The Admin build therefore receives
    # NEXT_PUBLIC_BASE_PATH=/admin, and the admin service in compose passes it
    # through; the two must not drift apart.
    #
    # The /admin prefix is preserved, so the upstream sees the path the basePath
    # expects.
    location = /admin {
        return 301 /admin/;
    }

    location /admin {
        # The /admin prefix must survive, because the Admin is built with
        # NEXT_PUBLIC_BASE_PATH=/admin and expects the path it was built for.
        proxy_pass $admin_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # --- Product media (S3-compatible object storage) ------------------------
    # PUBLIC_MEDIA_ORIGIN is the browser-facing base for published product
    # images, and the API builds URLs as `<origin>/<object key>`. Object keys
    # carry no bucket name, but the object store is addressed path-style, so a
    # request has to arrive as `/{bucket}/{key}`.
    #
    # Stripping the `/media/` prefix below is therefore load-bearing: a request
    # for `/media/products/renditions/...` must reach the store as
    # `/products/renditions/...`. That means PUBLIC_MEDIA_ORIGIN must include
    # the bucket segment (`.../media/products` for OBJECT_STORAGE_BUCKET=products),
    # the same shape local development already uses via localhost:9000.
    # Changing OBJECT_STORAGE_BUCKET without changing PUBLIC_MEDIA_ORIGIN breaks
    # every product image, so both live in the env template next to each other.
    #
    # Bucket listing is not exposed; only keys the API publishes are reachable.
    location /media/ {
        # The /media prefix is stripped by this rewrite rather than by a trailing
        # slash on proxy_pass. A proxy_pass that contains a variable cannot carry
        # a URI component, so nginx would forward the untouched request URI and
        # the store would look for a key literally starting with "media/". The
        # capture group supplies the leading slash, so the store receives
        # /<bucket>/<key> exactly as a path-style S3 request requires.
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- Storefront ----------------------------------------------------------
    # The storefront is a single-page app, so unknown paths fall back to
    # index.html and the client router resolves them. `index.html` is served
    # without caching; hashed assets under /assets are immutable.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
