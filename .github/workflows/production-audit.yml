name: Production Dependency Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly baseline scan catches advisories published without a lockfile change.
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    name: production-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Reject known production vulnerabilities
        run: |
          set -e
          attempt=1
          for i in 1 2 3; do
            if pnpm audit --prod --audit-level=moderate; then
              exit 0
            fi
            echo "::warning::pnpm audit attempt $i failed, retrying..."
            sleep 15
          done
          echo "::error::pnpm audit failed after 3 attempts"
          exit 1
