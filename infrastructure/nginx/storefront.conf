# Public storefront vhost.
#
# This is the only container that publishes a host port. Postgres, Redis, the
# object store, the API and the Admin stay on the internal Compose network and
# are reached only through this proxy, so the database and cache are not
# exposed to the internet.
#
# Upstream names must match the Compose service names.
#
# Docker's embedded DNS server is 127.0.0.11, and it is the only way to make
# these upstreams survive a restart. A `server api:4000` inside an `upstream`
# block is resolved once, at startup, and never again: when the api container is
# recreated it usually gets a different IP, and nginx keeps dialling the old one
# until someone restarts this container. That is not a theoretical concern, it
# is what a host reboot does. The symptom is a 502 on exactly the routes that
# depend on a restarted backend, while everything else still looks healthy.
#
# The fix is to resolve the name per request instead, which requires a `resolver`
# and a variable in `proxy_pass` (nginx does not re-parse a literal hostname,
# and it will not use a variable for an `upstream` block's server list). The
# tradeoff is that a variable in proxy_pass drops the automatic URI handling, so
# the URI is written out explicitly per location, which is where the `/media/`
# prefix-stripping comment in the routing file becomes load-bearing rather than
# incidental.
#
# --- how this file is factored ------------------------------------------------
#
# nginx has no way to share directives between sibling `server` blocks. Serving
# both HTTP and HTTPS here means two of them, and hand-copying the request
# routing into both is how the two listeners drift until one serves something the
# other cannot. So the routing is a single `include`d file, and the only thing
# repeated between the blocks is a fixed preamble with no per-listener variation.
#
# There are two listeners rather than one redirecting pair because certificate
# renewal has to keep working while TLS is already being served, and it does that
# over plain HTTP on port 80. Certbot is pointed at the HTTP block's document root
# with --webroot, so renewal never has to stop the proxy. --standalone would
# require it, and with a 6-day certificate a window where port 80 is closed is a
# window where renewal fails.

# --- shared preamble, repeated once per server block ---------------------------
#
# The stock default.conf shipped in the base image declared the docroot, and
# replacing that file dropped it. Without an explicit root, Nginx falls back to
# its compiled-in default, which does not exist in this image, and every
# storefront request 404s.

# --- plain HTTP ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # `resolver` and `set` are both server-context directives: `set` is rejected
    # at the top level of an included file, so they live inside the server block.
    # 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;
    set $admin_upstream http://admin:3001;
    set $media_upstream http://object-store:9000;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # Let's Encrypt HTTP-01 validation. Served from the same directory Certbot
    # writes to (--webroot), bind-mounted from the host, so renewal works without
    # ever closing this port.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # The container's own healthcheck probes this over plain HTTP, so it has to
    # exist here as well as in the HTTPS block. It is the one location that is
    # deliberately duplicated rather than shared: probing it over HTTPS would
    # mean the container validates a certificate against 127.0.0.1, and wget
    # would reject the real certificate for a name that is not the host it was
    # issued for.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is redirected to HTTPS. The API refuses to boot in
    # staging/production unless STOREFRONT_ORIGIN and PUBLIC_MEDIA_ORIGIN are
    # https, so this is what keeps the browser from being handed an http URL that
    # the vhost will not serve.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;
    set $admin_upstream http://admin:3001;
    set $media_upstream http://object-store:9000;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # Let's Encrypt IP address certificates. Issued with --preferred-profile
    # shortlived, so they are valid for only 6 days; the renewal timer in the
    # runbook is what keeps this from lapsing, not a long expiry.
    #
    # Mounted under /etc/nginx/tls rather than referenced at /etc/letsencrypt,
    # because the host's Certbot storage is bind-mounted here and Certbot's own
    # archive/ + live/ layout is not something to depend on.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Do not advertise the Nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    include /etc/nginx/snippets/storefront-locations.conf;
}
