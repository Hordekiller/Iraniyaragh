# SonarCloud analysis properties
# ---------------------------------------------------------------
# key + organization are derived from the GitHub-imported project
# (for a user-account repo the convention is <username> and <username>_<repo>).
# Verify at SonarCloud → project → "Information" or "How to analyze" and update
# below if your actual keys differ.
sonar.organization=hordekiller
sonar.projectKey=hordekiller_Iraniyaragh

sonar.projectName=Iraniyaragh
sonar.sources=apps/api/src,apps/web/src,apps/admin/src,packages/contracts/src
sonar.test.inclusions=**/*.spec.ts,**/*.integration-spec.ts,**/*.http.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.integration-spec.ts,**/*.http.spec.ts,**/*.test.ts,**/*.test.tsx,**/migrations/**
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,apps/admin/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json,apps/admin/tsconfig.json
sonar.sourceEncoding=UTF-8
