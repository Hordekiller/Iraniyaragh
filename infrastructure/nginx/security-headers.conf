# Security headers shared by the storefront vhost.
#
# This lives in its own file because `add_header` does not merge: a `location`
# that sets any header replaces the whole inherited set. Keep this include in
# each future location that adds a response header so it cannot silently discard
# the inherited security policy. Next owns storefront cache response headers.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# HSTS belongs in the shared set as well: any future location that re-includes
# these headers must retain transport protection alongside its local policy.
#
# Not preloaded and no includeSubDomains: a staging host on a bare IP must not be
# able to pin a browser for other hosts.
add_header Strict-Transport-Security "max-age=31536000" always;

# Stable through API, SSR and proxy-generated failures.
add_header X-Request-ID $diagnostic_request_id always;
add_header X-Correlation-ID $diagnostic_correlation_id always;
