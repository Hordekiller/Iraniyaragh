packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

overrides:
  '@prisma/config>deepmerge-ts': 8.0.2
  # GHSA-q7qp-rjg7-q26m: release pending fileFilter callbacks after teardown.
  multer: 2.5.0
  # GHSA-27r3-jxmh-p828: reject trailing compressed request-body bytes safely.
  body-parser: 2.4.0
  # ExcelJS accepts uuid.v4 from the patched uuid major; older uuid releases
  # are rejected by dependency-review for missing buffer bounds checks.
  uuid: 11.1.1
  # Patch-only pins for production audit advisories published on 2026-09-29.
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'js-yaml@5': 5.4.1
  # Patch releases required by the production audit on 2026-10-07.
  # GHSA-jqcg-44mw-7w3h: preserve Express's trusted-proxy IP validation.
  proxy-addr: 2.0.8
  # GHSA-68fv-2mgg-jv7q: validate indexed source-map section offsets.
  source-map-js: 1.2.2
  # GHSA-wq5f-xc86-pv6w: patch the API and Next image processor together.
  sharp: 0.35.5

  # Patch the current tooling chains without the deferred framework-major train.
  fast-uri@3: 3.1.8
  brace-expansion@5: 5.0.12
