version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 4
    rebase-strategy: auto
    labels:
      - type:chore
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      # Prisma CLI and Client must be proposed together across dependency types.
      prisma:
        patterns: ["prisma", "@prisma/client"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Tehran
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels:
      - type:chore
      - area:infra
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns:
          - "*"
