name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iranyaragh/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app_test:app_test@127.0.0.1:5432/iraniyaragh_ci_test?schema=public
      PSQL_DATABASE_URL: postgresql://app_test:app_test@127.0.0.1:5432/iraniyaragh_ci_test
      SHADOW_DATABASE_URL: postgresql://app_test:app_test@127.0.0.1:5432/ci_shadow_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: iranyaragh_ci_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d iranyaragh_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Generate and validate Prisma client
        run: |
          pnpm --filter @iranyaragh/api prisma:generate
          pnpm --filter @iranyaragh/api exec prisma validate
      - name: Apply and verify migrations
        run: |
          pnpm --filter @iranyaragh/api exec prisma migrate deploy
          pnpm --filter @iranyaragh/api exec prisma migrate status
      - name: Create isolated migration shadow database
        run: >-
          psql "postgresql://app_test:app_test@127.0.0.1:5432/postgres"
          --set ON_ERROR_STOP=1
          --command 'CREATE DATABASE "ci_shadow_test"'
      - name: Reject migration and schema drift
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code
      - name: Verify Auth database constraints
        run: >-
          psql "$PSQL_DATABASE_URL"
          --set ON_ERROR_STOP=1
          --file apps/api/prisma/tests/auth_constraints.sql
      - name: Verify state-machine database constraints
        run: >-
          psql "$PSQL_DATABASE_URL"
          --set ON_ERROR_STOP=1
          --file apps/api/prisma/tests/state_transitions.sql
      - name: Verify Money database constraints
        run: >-
          psql "$PSQL_DATABASE_URL"
          --set ON_ERROR_STOP=1
          --file apps/api/prisma/tests/money_migration.sql
      - name: Run database integration tests
        run: pnpm test:integration

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm --filter @iranyaragh/e2e exec playwright install --with-deps chromium
      - name: Run web and admin smoke suite
        run: pnpm e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
