# Security headers shared by the storefront vhost.
#
# This lives in its own file because `add_header` does not merge: a `location`
# that sets any header replaces the whole inherited set. The storefront needs a
# different Cache-Control on `index.html` and on hashed assets, so those two
# locations must re-declare the security headers rather than silently drop them.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# HSTS belongs here rather than in the server block, and that is not a stylistic
# choice. `add_header` does not merge with anything inherited: a `location` that
# sets any header at all discards the whole parent set. The locations that
# re-include this file for their own Cache-Control would therefore have silently
# dropped an HSTS declared one level up, and they are exactly the two that a
# browser hits on a cold load of the storefront. Putting it in the shared set is
# the only placement that cannot be forgotten by the next location added.
#
# Not preloaded and no includeSubDomains: a staging host on a bare IP must not be
# able to pin a browser for other hosts.
add_header Strict-Transport-Security "max-age=31536000" always;
