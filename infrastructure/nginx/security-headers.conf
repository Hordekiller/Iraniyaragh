# Security headers shared by the storefront vhost.
#
# This lives in its own file because `add_header` does not merge: a `location`
# that sets any header replaces the whole inherited set. The storefront needs a
# different Cache-Control on `index.html` and on hashed assets, so those two
# locations must re-declare the security headers rather than silently drop them.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
