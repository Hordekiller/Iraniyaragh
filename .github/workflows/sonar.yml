name: SonarCloud

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      ALLOW_DATABASE_SEED: "true"
      DATABASE_URL: postgresql://app_test:app_test@127.0.0.1:5432/iraniyaragh_sonar_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: iranyaragh_sonar_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d iranyaragh_sonar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare integration database
        run: |
          pnpm --filter @iranyaragh/api prisma:generate
          pnpm --filter @iranyaragh/api prisma:deploy
          pnpm --filter @iranyaragh/api prisma:seed
      - name: Unit tests with coverage (lcov for Sonar)
        run: pnpm --filter @iranyaragh/api --filter @iranyaragh/web --filter @iranyaragh/admin test
      - name: PostgreSQL integration tests with coverage (lcov for Sonar)
        run: pnpm --filter @iranyaragh/api test:integration
      - name: Require SonarCloud token for trusted analysis
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not configured for this trusted SonarCloud run. Add it as a repository or organization secret."
            exit 1
          fi
      - name: SonarCloud Scan
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
